const dec = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const derive = async (pw, salt) => crypto.subtle.deriveKey(
  { name:'PBKDF2', salt: dec(salt), iterations: 310000, hash:'SHA-256' },
  await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']),
  { name:'AES-GCM', length:256 }, false, ['decrypt']);
const open = async rawK => {
  const key = await crypto.subtle.importKey('raw', rawK, 'AES-GCM', false, ['decrypt']);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt(
    { name:'AES-GCM', iv: dec(DATA.page.iv) }, key, dec(DATA.page.ct)));
  localStorage.setItem('fh-key', btoa(String.fromCharCode(...new Uint8Array(rawK))));
  document.open(); document.write(html); document.close();
};
const tryPw = async pw => {
  for (const w of DATA.wraps) {
    try {
      const rawK = await crypto.subtle.decrypt({ name:'AES-GCM', iv: dec(w.iv) }, await derive(pw, w.salt), dec(w.ct));
      await open(rawK); return true;
    } catch {}
  }
  return false;
};
const cached = localStorage.getItem('fh-key');
if (cached) { try { await open(dec(cached).buffer); } catch { localStorage.removeItem('fh-key'); } }
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const ok = await tryPw(document.getElementById('pw').value.trim().toLowerCase());
  if (!ok) document.getElementById('err').textContent = 'Not it — try again.';
});
